name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── SDK ────────────────────────────────────
  sdk:
    name: SDK (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: npm test
        working-directory: sdk

  # ── Contracts ──────────────────────────────
  # All contract tests run in a single job because they have
  # cross-contract WASM dependencies (agentfeed/valid/escrow
  # load agentcore's WASM, agentescrow loads agentfeed's WASM).
  contracts:
    name: Contracts (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install all contracts
      - run: npm install
        working-directory: contracts/agentcore
      - run: npm install
        working-directory: contracts/agentfeed
      - run: npm install
        working-directory: contracts/agentvalid
      - run: npm install
        working-directory: contracts/agentescrow

      # Build in dependency order: core → feed → valid/escrow
      - name: Build agentcore
        run: npm run build
        working-directory: contracts/agentcore
      - name: Build agentfeed
        run: npm run build
        working-directory: contracts/agentfeed
      - name: Build agentvalid
        run: npm run build
        working-directory: contracts/agentvalid
      - name: Build agentescrow
        run: npm run build
        working-directory: contracts/agentescrow

      # Test in dependency order
      - name: Test agentcore (71 tests)
        run: npm test
        working-directory: contracts/agentcore
      - name: Test agentfeed (16 tests)
        run: npm test
        working-directory: contracts/agentfeed
      - name: Test agentvalid (15 tests)
        run: npm test
        working-directory: contracts/agentvalid
      - name: Test agentescrow (23 tests)
        run: npm test
        working-directory: contracts/agentescrow

  # ── OpenClaw Plugin ────────────────────────
  openclaw:
    name: OpenClaw (Vitest)
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Build SDK first (openclaw depends on it)
      - run: npm install && npm run build
        working-directory: sdk
      # Override SDK dep to use local build
      - name: Link local SDK
        run: |
          npm install
          npm rm @xpr-agents/sdk 2>/dev/null || true
          npm install ../sdk
        working-directory: openclaw
      - run: npm run build
        working-directory: openclaw
      - run: npm test
        working-directory: openclaw

  # ── Indexer ────────────────────────────────
  indexer:
    name: Indexer (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: indexer
      - run: npm run build
        working-directory: indexer
      - run: npm test
        working-directory: indexer

  # ── Frontend ───────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Agent Runner ───────────────────────────
  agent-runner:
    name: Agent Runner (Build)
    runs-on: ubuntu-latest
    needs: openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: sdk
      - name: Build openclaw with local SDK
        run: |
          npm install
          npm rm @xpr-agents/sdk 2>/dev/null || true
          npm install ../sdk
          npm run build
        working-directory: openclaw
      - run: npm install && npm run build
        working-directory: openclaw/starter/agent

  # ── Scaffold sanity ────────────────────────
  # Prevents regressions where the create-xpr-agent template diverges from
  # the openclaw/starter source, and ensures the templates never ship the
  # legacy `XPR_PRIVATE_KEY` / `--key` patterns that the v0.3.0+ agent
  # runner refuses to boot with.
  scaffold:
    name: Scaffold Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Template ↔ source scripts in sync
        run: |
          set -e
          diff create-xpr-agent/template/start.sh openclaw/starter/start.sh \
            || { echo "::error::create-xpr-agent/template/start.sh has drifted from openclaw/starter/start.sh. Run: cp openclaw/starter/start.sh create-xpr-agent/template/start.sh"; exit 1; }
          diff create-xpr-agent/template/setup.sh openclaw/starter/setup.sh \
            || { echo "::error::create-xpr-agent/template/setup.sh has drifted from openclaw/starter/setup.sh. Run: cp openclaw/starter/setup.sh create-xpr-agent/template/setup.sh"; exit 1; }
      - name: No legacy XPR_PRIVATE_KEY in shipped scripts
        run: |
          set -e
          # Either set/exported as a runtime variable — both are unsupported
          # under the v0.3.0+ keychain pattern. (Allow it to appear as a
          # rejection / migration message — those tell the user what to do.)
          BAD=$(grep -nE '^[[:space:]]*(export[[:space:]]+)?XPR_PRIVATE_KEY=' \
            create-xpr-agent/template/start.sh \
            create-xpr-agent/template/setup.sh \
            openclaw/starter/start.sh \
            openclaw/starter/setup.sh \
            openclaw/starter/bootstrap.sh 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "::error::Scripts assign or export XPR_PRIVATE_KEY at runtime — incompatible with the proton CLI keychain pattern:"
            echo "$BAD"
            exit 1
          fi
      - name: No --key flag plumbing in shipped scripts
        run: |
          set -e
          # The --key flag must either not exist OR exist solely to reject
          # the legacy invocation with a migration message. Accept lines
          # like `--key)` only if followed by an `err`/`exit 1` block within
          # 10 lines.
          for f in create-xpr-agent/template/start.sh create-xpr-agent/template/setup.sh openclaw/starter/start.sh openclaw/starter/setup.sh; do
            if grep -nE '^[[:space:]]*--key[)]?[[:space:]]+XPR_PRIVATE_KEY=' "$f" >/dev/null; then
              echo "::error::$f still accepts --key into XPR_PRIVATE_KEY (legacy pattern)"
              exit 1
            fi
          done
